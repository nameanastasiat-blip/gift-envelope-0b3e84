<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Подарочный сертификат</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#2b2f33; --bg2:#131517;
    --ink:#1e2124;
    --dark:#262a2e;
    --rose1:#f1d6c3; --rose2:#c99b80; --rose3:#9a705b;
    --hand:#26407a;
    --wish:#a4806b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 90% at 50% 35%, var(--bg1) 0%, var(--bg2) 75%);
    color:#efe6d6;
    font-family:"Montserrat",system-ui,sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- сцена ---------- */
  .stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
  .hint{
    position:fixed;left:0;right:0;bottom:max(20px,5vh);z-index:20;text-align:center;pointer-events:none;
    font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#a68a6e;
    transition:opacity .6s;
    animation:breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe{50%{opacity:.45}}
  body.opened .hint{animation:none;opacity:0;transform:translateY(-10px);pointer-events:none}

  /* ---------- конверт ---------- */
  .env{
    position:relative;flex:none;
    /* конверт всегда закрывает весь экран (как background-size: cover) */
    /* на вертикальных экранах (телефон) обрезаем не больше чем до 150% ширины */
    width:max(100vw, min(calc(100vh * 1672 / 941), 150vw));
    width:max(100vw, min(calc(100dvh * 1672 / 941), 150vw));
    aspect-ratio:1672/941;
  }
  .layer{position:absolute;inset:0;transition:opacity 1s ease, transform 1.1s cubic-bezier(.6,0,.3,1)}
  .back{
    z-index:1;
    background:
      linear-gradient(180deg, rgba(90,70,40,.28), rgba(90,70,40,0) 35%),
      linear-gradient(180deg,#ddd0b3,#e9dfc8);
  }
  .body{z-index:3;background:url(assets/body.webp) center/100% 100% no-repeat;pointer-events:none}

  .flap{
    position:absolute;left:0;top:0;width:100%;height:73.2%;
    z-index:4;
    transform-origin:50% 0;
    transform:perspective(1600px) rotateX(0deg);
    transform-style:preserve-3d;
    transition:transform 1s cubic-bezier(.55,.05,.35,1), opacity 1s ease;
  }
  .flap .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .flap .front{background:url(assets/flap.webp) center/100% 100% no-repeat}
  .flap .inside{
    transform:rotateX(180deg);
    clip-path:polygon(0 100%,100% 100%,50% 0);
    background:linear-gradient(0deg,#d8caad,#efe6d1 70%,#f5eedd);
  }
  .env.open .flap{transform:perspective(1600px) rotateX(180deg)}
  .env.flap-back .flap{z-index:0}

  /* ---------- печать ---------- */
  .seal{
    position:absolute;z-index:6;
    left:38.88%;top:44%;width:21.53%;height:38.26%;
    cursor:pointer;border:0;background:none;
    filter:drop-shadow(0 6px 6px rgba(70,45,10,.35));
    transition:transform .35s ease;
    animation:sealPulse 2.4s ease-in-out infinite;
  }
  .seal:hover{transform:scale(1.05)}
  .seal:focus-visible{outline:2px solid #e9c99a;outline-offset:4px;border-radius:50%}
  @keyframes sealPulse{
    0%,100%{filter:drop-shadow(0 6px 6px rgba(70,45,10,.35)) drop-shadow(0 0 0 rgba(255,210,140,0))}
    50%{filter:drop-shadow(0 6px 6px rgba(70,45,10,.35)) drop-shadow(0 0 18px rgba(255,210,140,.55))}
  }
  .seal i{
    position:absolute;inset:0;background:url(assets/seal.webp) center/100% 100% no-repeat;
    transition:transform .9s cubic-bezier(.5,0,.6,1), opacity .9s ease;
  }
  .seal .l{clip-path:polygon(0 0,53% 0,47% 26%,55% 44%,46% 63%,52% 81%,47% 100%,0 100%)}
  .seal .r{clip-path:polygon(53% 0,100% 0,100% 100%,47% 100%,52% 81%,46% 63%,55% 44%,47% 26%)}
  .env.broken .seal{animation:none;pointer-events:none}
  .env.broken .seal .l{transform:translate(-28%,60%) rotate(-28deg);opacity:0}
  .env.broken .seal .r{transform:translate(28%,60%) rotate(24deg);opacity:0}

  /* ---------- сертификат ---------- */
  .cert{
    position:absolute;z-index:2;
    left:13%;top:3%;width:74%;
    aspect-ratio:841.89/595.28;
    container-type:inline-size;
    background:#fbfaf7;
    border-radius:.6cqw;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.2);
    transform-origin:50% 50%;
    transition:transform 1s cubic-bezier(.5,0,.25,1), box-shadow 1s, opacity .5s ease;
    font-family:"Montserrat",sans-serif;
    color:var(--ink);
    opacity:0;               /* пока конверт открывается, сертификата не видно */
  }
  .env.front .cert{opacity:1}
  /* конверт растворяется после конфетти */
  .env.gone .layer, .env.gone .flap{opacity:0;transition:opacity .9s ease, transform .9s ease}
  .env.gone .back, .env.gone .body{transform:scale(.96)}

  /* ---------- конфетти ---------- */
  #confetti{position:fixed;inset:0;width:100%;height:100%;z-index:15;pointer-events:none}
  .env.front .cert{z-index:10;box-shadow:0 40px 80px rgba(0,0,0,.5),0 8px 20px rgba(0,0,0,.3);transition-duration:1s,1s,.8s}

  .cert-img{display:block;width:100%;height:100%;object-fit:cover}
  .cert-mob{display:none}

  /* ---------- кнопки ---------- */
  .actions{
    position:fixed;left:0;right:0;bottom:max(16px,3vh);display:flex;gap:12px;justify-content:center;
    opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .6s .2s, transform .6s .2s;
  }
  body.done .actions{opacity:1;transform:none;pointer-events:auto}
  .actions button{
    font:600 13px/1 "Montserrat",sans-serif;letter-spacing:.08em;text-transform:uppercase;
    padding:13px 20px;border-radius:999px;cursor:pointer;
    border:1px solid rgba(217,185,162,.55);background:rgba(255,255,255,.04);color:#ead2bf;
  }
  .actions button:hover{background:rgba(217,185,162,.14)}
  .actions button.primary{background:linear-gradient(100deg,#c99b80,#e3c1a9);color:#2a1f18;border-color:transparent}

  /* ---------- вертикальный конверт для телефона ---------- */
  @media (orientation: portrait){
    .env{
      width:max(100vw, calc(100vh * 941 / 1672));
      width:max(100vw, calc(100dvh * 941 / 1672));
      aspect-ratio:941/1672;
    }
    .body{background-image:url(assets/mbody.webp)}
    .flap{height:49.1%}
    .flap .front{background-image:url(assets/mflap.webp)}
    .seal{left:30.71%;top:38.76%;width:38.26%;height:21.53%}
    .seal i{background-image:url(assets/mseal.webp)}
    .cert{left:16%;top:14%;width:68%;aspect-ratio:360/640;border-radius:1.5%/0.85%}
    .cert-pc{display:none}
    .cert-mob{display:block}
  }

  .no-anim, .no-anim *{transition:none !important}

  @media (prefers-reduced-motion: reduce){
    .flap,.cert,.layer,.seal i{transition-duration:.01s !important}
  }

  /* ---------- печать ---------- */
  @page{size:A5 landscape;margin:0}
  @media print{
    body{background:#fff;overflow:visible}
    .hint,.actions,.layer,.flap,.seal{display:none !important}
    .stage{position:static;padding:0;display:block}
    .env{width:100%;filter:none;aspect-ratio:auto}
    #confetti{display:none}
    .cert{position:static;width:100%;opacity:1;transform:none !important;box-shadow:none;border-radius:0}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<main class="stage">

  <div class="env" id="env">
    <div class="layer back"></div>

    <section class="cert" id="cert" aria-label="Подарочный сертификат: Соколова Алина Алексеевна, ЖК «Имена», 36,33 м²">
      <img class="cert-img cert-pc" src="assets/cert-pc.webp" alt="">
      <img class="cert-img cert-mob" src="assets/cert-mob.webp" alt="">
    </section>

    <div class="layer body"></div>
    <div class="flap" id="flap">
      <div class="face front"></div>
      <div class="face inside"></div>
    </div>
    <button class="seal" id="seal" aria-label="Открыть конверт"><i class="l"></i><i class="r"></i></button>
  </div>

  <div class="hint">Нажмите на печать</div>
</main>

<canvas id="confetti" aria-hidden="true"></canvas>

<div class="actions">
  <button id="again">Открыть заново</button>
  <button class="primary" id="print">Распечатать</button>
</div>

<script>
(() => {
  const env = document.getElementById('env');
  const cert = document.getElementById('cert');
  const seal = document.getElementById('seal');
  const body = document.body;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const k = reduce ? 0.05 : 1;
  let timers = [];
  const at = (ms, fn) => timers.push(setTimeout(fn, ms * k));

  function placeCert(mul = 1){
    // где сертификат лежит без трансформаций
    const r = env.getBoundingClientRect();
    const w = cert.offsetWidth, h = cert.offsetHeight;
    const cx = r.left + cert.offsetLeft + w / 2;
    const cy = r.top + cert.offsetTop + h / 2;
    const vw = innerWidth, vh = innerHeight;
    const targetW = Math.min(vw * 0.92, 1040, (vh - 120) * (w / h));
    const s = targetW / w * mul;
    const tx = vw / 2 - cx;
    const ty = (vh - 60) / 2 - cy;
    cert.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  }

  /* ---------- золотое конфетти ---------- */
  const cv = document.getElementById('confetti');
  const cx2 = cv.getContext('2d');
  // тона фольги: светлое шампанское, золото, тёмная бронза — [светлый, средний, тёмный]
  const TONES = [
    ['#fff6d6','#f1dc9a','#d8b864'],
    ['#fbeaa8','#e3c056','#b88d2a'],
    ['#f5d98a','#d4a93c','#9c7421'],
    ['#e9c97a','#c2952f','#7f5a18'],
    ['#d9b46a','#a97d2a','#5e3f12'],
    ['#fff9e8','#ecdcae','#c9ad6c']
  ];
  const SPR = 96;
  // заранее рисуем набор круглых «фольгированных» конфетти с градиентом
  const sprites = Array.from({length: 30}, (_, i) => {
    const c = document.createElement('canvas'); c.width = c.height = SPR;
    const g = c.getContext('2d'), R = SPR / 2 - 2;
    const [lt, md, dk] = TONES[i % TONES.length];
    const ang = Math.random() * Math.PI * 2;
    const dx = Math.cos(ang) * R, dy = Math.sin(ang) * R;
    const lg = g.createLinearGradient(SPR/2 - dx, SPR/2 - dy, SPR/2 + dx, SPR/2 + dy);
    lg.addColorStop(0, lt); lg.addColorStop(.45, md); lg.addColorStop(1, dk);
    g.beginPath(); g.arc(SPR/2, SPR/2, R, 0, Math.PI * 2); g.fillStyle = lg; g.fill();
    g.save(); g.clip();
    // блик-полоса, как на мятой фольге
    if (Math.random() < .55){
      const a2 = ang + (Math.random() - .5) * 1.2, off = (Math.random() - .5) * R;
      const bx = Math.cos(a2 + Math.PI/2) * off, by = Math.sin(a2 + Math.PI/2) * off;
      const sg = g.createLinearGradient(SPR/2 + bx - Math.cos(a2)*R*.35, SPR/2 + by - Math.sin(a2)*R*.35,
                                        SPR/2 + bx + Math.cos(a2)*R*.35, SPR/2 + by + Math.sin(a2)*R*.35);
      sg.addColorStop(0, 'rgba(255,250,230,0)'); sg.addColorStop(.5, 'rgba(255,250,230,.7)'); sg.addColorStop(1, 'rgba(255,250,230,0)');
      g.fillStyle = sg; g.fillRect(0, 0, SPR, SPR);
    }
    // мелкая зернистость фольги
    for (let k = 0; k < 140; k++){
      g.fillStyle = Math.random() < .5 ? 'rgba(255,255,240,.18)' : 'rgba(80,50,10,.12)';
      g.fillRect(Math.random() * SPR, Math.random() * SPR, 1.5, 1.5);
    }
    // тонкий светлый край
    g.restore();
    g.beginPath(); g.arc(SPR/2, SPR/2, R - .8, 0, Math.PI * 2);
    g.strokeStyle = 'rgba(255,245,210,.35)'; g.lineWidth = 1.6; g.stroke();
    return c;
  });
  let parts = [], raf = 0, dpr = 1;

  function sizeCanvas(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  }
  sizeCanvas();

  function burst(n, spread, power){
    const r = env.getBoundingClientRect();
    const vh = innerHeight, vw = innerWidth;
    // точка выброса — горловина конверта (её верх может быть за экраном)
    const ox = vw / 2;
    const oy = Math.min(Math.max(r.top + r.height * 0.3, vh * 0.22), vh * 0.5);
    const sc = Math.min(vw, vh) / 800 + 0.45;          // масштаб под размер экрана
    for (let i = 0; i < n; i++){
      const a = -Math.PI / 2 + (Math.random() - 0.5) * spread;
      const v = (power * (0.55 + Math.random() * 0.6)) * sc;
      const small = Math.random() < 0.22;
      parts.push({
        x: ox + (Math.random() - 0.5) * vw * 0.25, y: oy + Math.random() * 20,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        d: (small ? 8 + Math.random() * 6 : 18 + Math.random() * 16) * sc,
        rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 0.2,
        flip: Math.random() * Math.PI * 2, vf: 0.05 + Math.random() * 0.09,
        sway: Math.random() * Math.PI * 2,
        spr: sprites[(Math.random() * sprites.length) | 0],
        life: 0
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }

  let last = 0;
  function tick(t){
    const dt = Math.min(2, last ? (t - last) / 16.67 : 1); last = t;
    const W = innerWidth, H = innerHeight;
    cx2.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx2.clearRect(0, 0, W, H);
    parts = parts.filter(p => p.y < H + 40 && p.life < 900);
    for (const p of parts){
      p.life += dt;
      p.vy += 0.32 * dt;                 // гравитация
      p.vx *= Math.pow(0.985, dt);       // сопротивление воздуха
      p.vy *= Math.pow(0.985, dt);
      if (p.vy > 3.2) p.vy = 3.2 + (p.vy - 3.2) * 0.9;   // плавное парение вниз
      p.sway += 0.05 * dt;
      p.x += (p.vx + Math.sin(p.sway) * 0.6) * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt; p.flip += p.vf * dt;
      const f = Math.cos(p.flip);
      cx2.save();
      cx2.translate(p.x, p.y); cx2.rotate(p.rot); cx2.scale(1, Math.abs(f) * 0.9 + 0.1);
      cx2.drawImage(p.spr, -p.d / 2, -p.d / 2, p.d, p.d);
      // диск поворачивается к свету — вспыхивает
      if (f > 0.85){ cx2.globalAlpha = (f - 0.85) * 1.6; cx2.globalCompositeOperation = 'lighter';
        cx2.drawImage(p.spr, -p.d / 2, -p.d / 2, p.d, p.d);
        cx2.globalAlpha = 1; cx2.globalCompositeOperation = 'source-over'; }
      cx2.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : 0;
    if (!raf){ last = 0; cx2.clearRect(0, 0, W, H); }
  }

  function clearConfetti(){
    parts = []; if (raf) cancelAnimationFrame(raf); raf = 0; last = 0;
    cx2.setTransform(1, 0, 0, 1, 0, 0); cx2.clearRect(0, 0, cv.width, cv.height);
  }

  function open(){
    if (body.classList.contains('opened')) return;
    body.classList.add('opened');
    env.classList.add('broken');
    at(450,  () => env.classList.add('open'));
    at(950,  () => env.classList.add('flap-back'));
    if (!reduce){
      at(900,  () => burst(170, 1.5, 17));
      at(1150, () => burst(90, 2.2, 13));
      at(1450, () => burst(60, 1.0, 11));
    }
    // конфетти → конверт растворяется → появляется сертификат
    at(2200, () => env.classList.add('gone'));
    at(3000, () => {
      // ставим сертификат сразу в центр (чуть меньше), без пролёта
      cert.style.transition = 'none';
      placeCert(0.9);
      void cert.offsetWidth;
      cert.style.transition = '';
      env.classList.add('front');
      placeCert(1);
    });
    at(3900, () => body.classList.add('done'));
  }

  function reset(){
    timers.forEach(clearTimeout); timers = [];
    clearConfetti();
    body.classList.add('no-anim');
    body.classList.remove('opened','done');
    env.classList.remove('broken','open','flap-back','gone','front');
    cert.style.transform = '';
    void env.offsetWidth;
    body.classList.remove('no-anim');
  }

  seal.addEventListener('click', open);
  env.addEventListener('click', e => { if (!body.classList.contains('opened')) open(); });
  document.getElementById('again').addEventListener('click', reset);
  document.getElementById('print').addEventListener('click', () => print());
  addEventListener('resize', () => { sizeCanvas(); if (env.classList.contains('front')) placeCert(); });
})();
</script>
</body>
</html>
